<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Validador de Blocklist{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --fundo: #f5f6f8; --cartao: #ffffff; --texto: #1f2937; --suave: #6b7280;
      --borda: #d1d5db; --destaque: #2563eb; --texto-botao: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #111827; --cartao: #1f2937; --texto: #f3f4f6; --suave: #9ca3af;
        --borda: #374151; --destaque: #60a5fa; --texto-botao: #0b1220;
      }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--fundo); color: var(--texto);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(92vw, 28rem); box-sizing: border-box; padding: 1.75rem;
      background: var(--cartao); border: 1px solid var(--borda); border-radius: .75rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .aviso { color: var(--suave); font-size: .875rem; margin: 0 0 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: .7rem .8rem; font-size: 1.05rem;
      border: 1px solid var(--borda); border-radius: .5rem;
      background: transparent; color: inherit;
    }
    button {
      margin-top: 1rem; width: 100%; padding: .75rem; font-size: 1rem; font-weight: 600;
      border: 0; border-radius: .5rem; cursor: pointer;
      background: var(--destaque); color: var(--texto-botao);
    }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Validador de Blocklist</h1>
      <p class="aviso">Sistema de demonstração. Todos os dados são fictícios.</p>
    </header>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
