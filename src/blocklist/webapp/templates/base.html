<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Ícone vazio: evita o pedido de /favicon.ico (e o 404 no log) #}
  <link rel="icon" href="data:,">
  <title>{% block titulo %}Validador de Blocklist{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --fundo: #f5f6f8; --cartao: #ffffff; --texto: #1f2937; --suave: #6b7280;
      --borda: #d1d5db; --destaque: #2563eb; --texto-botao: #ffffff;

      /* Cores por status: fundo, borda e texto */
      --ok-fundo: #ecfdf5;   --ok-borda: #10b981;   --ok-texto: #065f46;
      --nao-fundo: #fef2f2;  --nao-borda: #ef4444;  --nao-texto: #991b1b;
      --inv-fundo: #fffbeb;  --inv-borda: #f59e0b;  --inv-texto: #92400e;
      --ind-fundo: #f3f4f6;  --ind-borda: #6b7280;  --ind-texto: #374151;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #111827; --cartao: #1f2937; --texto: #f3f4f6; --suave: #9ca3af;
        --borda: #374151; --destaque: #60a5fa; --texto-botao: #0b1220;

        --ok-fundo: #052e22;   --ok-borda: #34d399;   --ok-texto: #a7f3d0;
        --nao-fundo: #3b0d0d;  --nao-borda: #f87171;  --nao-texto: #fecaca;
        --inv-fundo: #3a2a05;  --inv-borda: #fbbf24;  --inv-texto: #fde68a;
        --ind-fundo: #111827;  --ind-borda: #9ca3af;  --ind-texto: #e5e7eb;
      }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--fundo); color: var(--texto);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: min(92vw, 28rem); box-sizing: border-box; padding: 1.75rem;
      background: var(--cartao); border: 1px solid var(--borda); border-radius: .75rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .aviso { color: var(--suave); font-size: .875rem; margin: 0 0 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: .7rem .8rem; font-size: 1.05rem;
      border: 1px solid var(--borda); border-radius: .5rem;
      background: transparent; color: inherit;
    }
    button, .botao-secundario {
      display: block; box-sizing: border-box; width: 100%; padding: .75rem;
      font-size: 1rem; font-weight: 600; text-align: center; text-decoration: none;
      border-radius: .5rem; cursor: pointer;
    }
    button { margin-top: 1rem; border: 0; background: var(--destaque); color: var(--texto-botao); }
    .botao-secundario {
      margin-top: 1.25rem; color: var(--destaque); background: transparent;
      border: 1px solid var(--destaque);
    }
    input:focus-visible, button:focus-visible, .botao-secundario:focus-visible {
      outline: 3px solid var(--destaque); outline-offset: 2px;
    }

    /* Tela de resultado: a cor vem do mesmo atributo que o robô lê (data-status) */
    #resultado {
      --fundo-status: var(--ind-fundo); --borda-status: var(--ind-borda); --texto-status: var(--ind-texto);
      display: grid; grid-template-columns: auto 1fr; column-gap: .9rem; align-items: start;
      padding: 1rem 1.1rem; border-radius: .6rem;
      border: 1px solid var(--borda-status); border-left-width: 6px;
      background: var(--fundo-status); color: var(--texto-status);
    }
    #resultado[data-status="APROVADO"]     { --fundo-status: var(--ok-fundo);  --borda-status: var(--ok-borda);  --texto-status: var(--ok-texto); }
    #resultado[data-status="REPROVADO"]    { --fundo-status: var(--nao-fundo); --borda-status: var(--nao-borda); --texto-status: var(--nao-texto); }
    #resultado[data-status="INVALIDO"]     { --fundo-status: var(--inv-fundo); --borda-status: var(--inv-borda); --texto-status: var(--inv-texto); }
    #resultado[data-status="INDISPONIVEL"] { --fundo-status: var(--ind-fundo); --borda-status: var(--ind-borda); --texto-status: var(--ind-texto); }
    #resultado .icone { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    #resultado h2 { font-size: 1.15rem; margin: 0 0 .3rem; letter-spacing: .03em; }
    #resultado p { margin: .25rem 0 0; }
    #resultado .cpf { font-size: .875rem; opacity: .85; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Validador de Blocklist</h1>
      <p class="aviso">Sistema de demonstração. Todos os dados são fictícios.</p>
    </header>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
