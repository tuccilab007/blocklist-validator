[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocklist-validator"
version = "0.1.0"
description = "Validador de blocklist ficticio: formulario + robo Playwright + devolutiva em planilha"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]